name: Sprint 7 Mobile Android

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sprint-7-qr-mobile-mvp
      - codex/sprint-7-standalone-apks

permissions:
  contents: read

jobs:
  android-standalone-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [payer-mobile, merchant-mobile]
    env:
      NODE_VERSION: 22.17.0
      PNPM_VERSION: 11.16.0
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          node --version
          pnpm --version

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck protocol and mobile apps
        run: |
          corepack pnpm typecheck
          corepack pnpm typecheck:mobile

      - name: Test protocol and payer bootstrap fixture
        run: corepack pnpm test:ts

      - name: Build shared protocol packages
        run: corepack pnpm build

      - name: Generate Android native project
        run: corepack pnpm --filter "${{ matrix.app }}" exec expo prebuild --platform android --no-install --clean

      # Physical phones use arm64. Limiting the preview artifact to this ABI
      # avoids a ~144 MB universal APK containing emulator and legacy binaries.
      # The release remains debug-key signed and is not a production release.
      - name: Compile arm64 standalone preview APK
        working-directory: apps/${{ matrix.app }}/android
        env:
          EXPO_PUBLIC_OGP_RUNTIME_MODE: development-fixture
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify signature, manifest, ABI, embedded bundle and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "apps/${{ matrix.app }}/android/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          unzip -l "$apk" | grep -E 'assets/(index\.android\.bundle|_expo/static/js/android/.+\.js)'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library in physical-device APK' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "${apk}.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint-7-${{ matrix.app }}-android-arm64-standalone-preview
          if-no-files-found: error
          path: |
            apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
            apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.sha256
