name: Sprint 7 Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [codex/sprint-7-qr-mobile-mvp]

permissions:
  contents: read

jobs:
  android-development-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [payer-mobile, merchant-mobile]
    env:
      NODE_VERSION: 22.17.0
      PNPM_VERSION: 11.16.0
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          node --version
          pnpm --version

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck protocol and mobile apps
        run: |
          corepack pnpm typecheck
          corepack pnpm typecheck:mobile

      - name: Build shared protocol packages
        run: corepack pnpm build

      - name: Generate Android native project
        run: corepack pnpm --filter "${{ matrix.app }}" exec expo prebuild --platform android --no-install --clean

      - name: Compile development APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint-7-${{ matrix.app }}-android-debug
          if-no-files-found: error
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
