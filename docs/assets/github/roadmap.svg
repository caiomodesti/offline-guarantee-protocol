  <rect width="1500" height="590" rx="28" fill="url(#bg)"/>
  <text x="70" y="66" fill="#A7BDF6" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">IMMUTABLE PROMPT MASTER ROADMAP</text>
  <text x="70" y="110" fill="#F2F5FA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Evidence before expansion.</text>
  <text x="70" y="142" fill="#91A1BE" font-family="Arial, sans-serif" font-size="16">Chronology is fixed. A sprint advances only after its acceptance gate passes.</text>
