<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="590" viewBox="0 0 1500 590" role="img" aria-labelledby="title desc">
  <title id="title">OGP immutable sprint roadmap</title><desc id="desc">Sprints zero through six complete, Sprint seven at physical device gate, Sprints eight through twelve planned.</desc>
