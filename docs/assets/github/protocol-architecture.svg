<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">OGP system architecture</title><desc id="desc">Offline payer and merchant exchange signed QR evidence, then online reconciliation verifies claims and settles collateral on Solana.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1A"/><stop offset="1" stop-color="#11192B"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6E91F2"/><stop offset="1" stop-color="#A579E8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".32"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7FA0F4"/></marker></defs>
  <rect width="1500" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" fill="#A7BDF6" font-family="ui-monospace, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <text x="70" y="112" fill="#F2F5FA" font-family="Arial, sans-serif" font-size="34" font-weight="700">Evidence travels. Trust does not.</text>
  <rect x="55" y="150" width="850" height="510" rx="24" fill="#0B1220" stroke="#2A3A5B" stroke-dasharray="9 8"/>
  <text x="82" y="188" fill="#7F91B3" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">OFFLINE TRUST BOUNDARY</text>
  <rect x="930" y="150" width="515" height="510" rx="24" fill="#0D1424" stroke="#3B4771"/>
  <text x="957" y="188" fill="#9B98CC" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">ONLINE AUTHORITY BOUNDARY</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 240)"><rect width="250" height="250" rx="20" fill="#111B30" stroke="#354B78"/><circle cx="125" cy="68" r="34" fill="#172B52" stroke="#6E91F2"/><path d="M108 70h34M125 53v34" stroke="#A7BDF6" stroke-width="5" stroke-linecap="round"/><text x="125" y="132" text-anchor="middle" fill="#F2F5FA" font-size="22" font-weight="700">Payer device</text><text x="125" y="162" text-anchor="middle" fill="#9EACC7" font-size="14">session-scoped key</text><text x="125" y="188" text-anchor="middle" fill="#9EACC7" font-size="14">monotonic branch</text><rect x="34" y="209" width="182" height="27" rx="13" fill="#182C50"/><text x="125" y="227" text-anchor="middle" fill="#A7BDF6" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SIGNS CREDENTIAL</text></g>
    <g transform="translate(610 240)"><rect width="250" height="250" rx="20" fill="#111B30" stroke="#354B78"/><circle cx="125" cy="68" r="34" fill="#172B52" stroke="#6E91F2"/><path d="M110 51h30v34h-30zM115 58h20M115 65h20M115 72h12" fill="none" stroke="#A7BDF6" stroke-width="4"/><text x="125" y="132" text-anchor="middle" fill="#F2F5FA" font-size="22" font-weight="700">Merchant device</text><text x="125" y="162" text-anchor="middle" fill="#9EACC7" font-size="14">verifies full chain</text><text x="125" y="188" text-anchor="middle" fill="#9EACC7" font-size="14">persists claim evidence</text><rect x="34" y="209" width="182" height="27" rx="13" fill="#182C50"/><text x="125" y="227" text-anchor="middle" fill="#A7BDF6" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ACCEPTS OFFLINE</text></g>
    <g transform="translate(970 240)"><rect width="210" height="250" rx="20" fill="#17172C" stroke="#615C97"/><circle cx="105" cy="68" r="34" fill="#28254A" stroke="#A579E8"/><path d="M88 55h34M88 68h34M88 81h22" stroke="#C4A9F1" stroke-width="4" stroke-linecap="round"/><text x="105" y="132" text-anchor="middle" fill="#F2F5FA" font-size="21" font-weight="700">Reconciler</text><text x="105" y="162" text-anchor="middle" fill="#AAA7CB" font-size="14">rebuilds valid DAG</text><text x="105" y="188" text-anchor="middle" fill="#AAA7CB" font-size="14">produces evidence</text><rect x="28" y="209" width="154" height="27" rx="13" fill="#2C284E"/><text x="105" y="227" text-anchor="middle" fill="#C4A9F1" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NOT TRUSTED ALONE</text></g>
    <g transform="translate(1210 240)"><rect width="200" height="250" rx="20" fill="#17172C" stroke="#615C97"/><circle cx="100" cy="68" r="34" fill="#28254A" stroke="#A579E8"/><path d="M84 52h32v32H84zM91 61h18v14H91z" fill="none" stroke="#C4A9F1" stroke-width="4"/><text x="100" y="132" text-anchor="middle" fill="#F2F5FA" font-size="21" font-weight="700">Solana program</text><text x="100" y="162" text-anchor="middle" fill="#AAA7CB" font-size="14">custody + final state</text><text x="100" y="188" text-anchor="middle" fill="#AAA7CB" font-size="14">SPL settlement CPI</text><rect x="23" y="209" width="154" height="27" rx="13" fill="#2C284E"/><text x="100" y="227" text-anchor="middle" fill="#C4A9F1" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AUTHORITATIVE</text></g>
  </g>
  <path d="M605 325H345" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M345 405H605" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="475" y="307" text-anchor="middle" fill="#A7BDF6" font-family="ui-monospace, monospace" font-size="12" font-weight="700">QR CHALLENGE</text><text x="475" y="432" text-anchor="middle" fill="#C4A9F1" font-family="ui-monospace, monospace" font-size="12" font-weight="700">QR CREDENTIAL PROOF</text>
  <path d="M735 500v72h340v-77" fill="none" stroke="#7FA0F4" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="890" y="603" text-anchor="middle" fill="#A7BDF6" font-family="ui-monospace, monospace" font-size="12" font-weight="700">RECONNECT · SUBMIT CLAIM</text>
  <path d="M1185 365h20" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1198" y="335" text-anchor="middle" fill="#C4A9F1" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PROOF</text>
  <g transform="translate(80 585)" font-family="ui-monospace, monospace" font-size="12"><circle cx="8" cy="-3" r="7" fill="#4ADE80"/><text x="24" y="2" fill="#B8C5DA">Signatures and hashes verified locally</text><circle cx="310" cy="-3" r="7" fill="#F4C95D"/><text x="326" y="2" fill="#B8C5DA">Offline timestamps are metadata only</text></g>
</svg>
